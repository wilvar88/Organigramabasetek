<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01326c" />
      <stop offset="55%" stop-color="#2279b1" />
      <stop offset="100%" stop-color="#43bff5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#01326c" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Badge Icon -->
  <rect x="6" y="10" width="60" height="60" rx="16" fill="url(#logoGrad)" filter="url(#shadow)" />
  
  <!-- Organigram Hierarchy Icon inside Badge -->
  <path d="M36 24 v12 M22 36 h28 M22 36 v14 M36 36 v14 M50 36 v14" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="30" y="20" width="12" height="9" rx="2" fill="#ffffff" />
  <rect x="16" y="47" width="12" height="9" rx="2" fill="#ffffff" />
  <rect x="30" y="47" width="12" height="9" rx="2" fill="#ffffff" />
  <rect x="44" y="47" width="12" height="9" rx="2" fill="#ffffff" />

  <!-- Typography -->
  <text x="80" y="42" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="22" font-weight="800" fill="#01326c" letter-spacing="-0.5">BASETEK S.A.S</text>
  <rect x="248" y="27" width="62" height="18" rx="9" fill="#43bff5" opacity="0.92" />
  <text x="279" y="39.5" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#01326c" text-anchor="middle" letter-spacing="0.5">CORP</text>
  
  <text x="82" y="60" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#2279b1" letter-spacing="0.2">Organigrama Corporativo</text>
</svg>
